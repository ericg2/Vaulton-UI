name: Build Windows release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.3.22
        required: true
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Resolve the release tag
        id: release
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:DISPATCH_TAG) {
            $tag = $env:DISPATCH_TAG
          } elseif ($env:EVENT_TAG) {
            $tag = $env:EVENT_TAG
          } else {
            $tag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.event_name == 'release' && steps.release.outputs.tag || github.ref_name) }}

      - name: Resolve the release version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: "echo value=$($env:TAG.TrimStart('v')) >> $env:GITHUB_OUTPUT"

      - name: Skip if the current release already has versioned Windows assets
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          EVENT: ${{ github.event_name }}
          FORCE_REBUILD: ${{ contains(github.event.head_commit.message, '[rebuild-release-assets]') }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$FORCE_REBUILD" != "true" ]]; then
            current_version="$(awk '/^version:/ { split($2, parts, "+"); print parts[1] }' pubspec.yaml)"
            setup_exists="$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "vaulton-$VERSION-windows-setup.exe" || true)"
            setup_sha_exists="$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "vaulton-$VERSION-windows-setup.exe.sha256" || true)"
            zip_exists="$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "vaulton-$VERSION-windows-x64.zip" || true)"
            zip_sha_exists="$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "vaulton-$VERSION-windows-x64.zip.sha256" || true)"
            if [[ "$current_version" != "$VERSION" || -z "$setup_exists" || -z "$setup_sha_exists" || -z "$zip_exists" || -z "$zip_sha_exists" ]]; then
              skip=false
            else
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.guard.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Generate platform runner if needed and resolve dependencies
        if: steps.guard.outputs.skip != 'true'
        run: dart run scripts/setup.dart

      - name: Build Windows release
        if: steps.guard.outputs.skip != 'true'
        run: flutter build windows --release

      - name: Install Inno Setup
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package versioned Windows assets
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $releaseDir = Join-Path $PWD 'build/release-assets'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $bundle = Join-Path $PWD 'build/windows/x64/runner/Release'
          if (-not (Test-Path (Join-Path $bundle 'vaulton.exe'))) { throw 'Windows executable was not produced.' }
          $zipName = "vaulton-$version-windows-x64.zip"
          $zip = Join-Path $releaseDir $zipName
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$zipHash  $zipName" -Encoding ascii
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          Push-Location installer
          try {
            & $iscc "/DAppVersion=$version" 'windows.iss'
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed to build the Windows installer.' }
          } finally {
            Pop-Location
          }
          $setupName = "vaulton-$version-windows-setup.exe"
          $setup = Join-Path $releaseDir $setupName
          if (-not (Test-Path $setup)) { throw "Windows installer was not produced: $setup" }
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$setup.sha256" -Value "$setupHash  $setupName" -Encoding ascii

      - name: Attach Windows packages to GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "build/release-assets/vaulton-$VERSION-windows-x64.zip" \
            "build/release-assets/vaulton-$VERSION-windows-x64.zip.sha256" \
            "build/release-assets/vaulton-$VERSION-windows-setup.exe" \
            "build/release-assets/vaulton-$VERSION-windows-setup.exe.sha256" --clobber

      - name: Remove legacy unversioned Windows assets
        if: always() && steps.release.outputs.tag != '' && steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -Fxq "vaulton-$VERSION-windows-setup.exe" <<< "$assets" &&
             grep -Fxq "vaulton-$VERSION-windows-x64.zip" <<< "$assets"; then
            for asset in Vaulton-Windows-Setup.exe Vaulton-Windows-Setup.exe.sha256 Vaulton-Windows.zip Vaulton-Windows.zip.sha256; do
              if grep -Fxq "$asset" <<< "$assets"; then gh release delete-asset "$TAG" "$asset" --yes; fi
            done
          fi
