name: Build Linux release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.3.21
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=${DISPATCH_TAG:-$EVENT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Resolve the release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Generate platform runner if needed and resolve dependencies
        run: dart run scripts/setup.dart

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux application
        shell: bash
        run: |
          set -euo pipefail
          bundle='build/linux/x64/release/bundle'
          test -x "$bundle/vaulton"
          mkdir -p build/release-assets
          archive='build/release-assets/Vaulton-Linux.tar.gz'
          tar -czf "$archive" -C "$bundle" .
          (cd build/release-assets && sha256sum Vaulton-Linux.tar.gz > Vaulton-Linux.tar.gz.sha256)

      - name: Install nFPM
        shell: bash
        env:
          NFPM_VERSION: 2.48.0
        run: |
          set -euo pipefail
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/checksums.txt" -o /tmp/nfpm-checksums.txt
          (cd /tmp && grep " ${archive}\$" nfpm-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$archive" -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build Linux packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          nfpm package --packager deb --config installer/nfpm.yaml --target build/release-assets/vaulton.deb
          nfpm package --packager rpm --config installer/nfpm.yaml --target build/release-assets/vaulton.rpm
          cd build/release-assets
          mv vaulton.deb Vaulton-Linux.deb
          mv vaulton.rpm Vaulton-Linux.rpm
          sha256sum Vaulton-Linux.deb > Vaulton-Linux.deb.sha256
          sha256sum Vaulton-Linux.rpm > Vaulton-Linux.rpm.sha256

      - name: Attach Linux packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" build/release-assets/Vaulton-Linux.tar.gz build/release-assets/Vaulton-Linux.tar.gz.sha256 build/release-assets/Vaulton-Linux.deb build/release-assets/Vaulton-Linux.deb.sha256 build/release-assets/Vaulton-Linux.rpm build/release-assets/Vaulton-Linux.rpm.sha256 --clobber
