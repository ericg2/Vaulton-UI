name: Build Linux release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Generate platform runner if needed and resolve dependencies
        run: dart run tool/setup.dart

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux application and installer
        shell: bash
        run: |
          set -euo pipefail
          bundle='build/linux/x64/release/bundle'
          test -x "$bundle/vaulton"
          mkdir -p build/release-assets
          archive='build/release-assets/Vaulton-Linux.tar.gz'
          tar -czf "$archive" -C "$bundle" .
          (cd build/release-assets && sha256sum Vaulton-Linux.tar.gz > Vaulton-Linux.tar.gz.sha256)
          cp installer/Vaulton-Linux-Install.sh build/release-assets/Vaulton-Linux-Install.sh
          chmod +x build/release-assets/Vaulton-Linux-Install.sh
          (cd build/release-assets && sha256sum Vaulton-Linux-Install.sh > Vaulton-Linux-Install.sh.sha256)

      - name: Attach Linux packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/release-assets/Vaulton-Linux.tar.gz build/release-assets/Vaulton-Linux.tar.gz.sha256 build/release-assets/Vaulton-Linux-Install.sh build/release-assets/Vaulton-Linux-Install.sh.sha256 --clobber
