name: Build Linux release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.3.22
        required: true
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'installer/**'
      - 'linux/**'
      - '.github/workflows/release-linux.yml'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$DISPATCH_TAG" ]]; then
            tag="$DISPATCH_TAG"
          elif [[ -n "$EVENT_TAG" ]]; then
            tag="$EVENT_TAG"
          else
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && steps.release.outputs.tag || github.ref_name }}

      - name: Resolve the release version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Skip if the current release already has versioned Linux assets
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$EVENT" == "push" ]]; then
            current_version="$(sed -n 's/^version: *\\([0-9.]*\\)+[0-9]*$/\\1/p' pubspec.yaml)"
            if [[ "$current_version" != "$VERSION" ]]; then
              skip=true
            else
              exists="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq --arg name "vaulton-$VERSION-linux-amd64.deb" 'any(.assets[]; .name == $name)')"
              [[ "$exists" == true ]] && skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.guard.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install Linux build dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Generate platform runner if needed and resolve dependencies
        if: steps.guard.outputs.skip != 'true'
        run: dart run scripts/setup.dart

      - name: Build Linux release
        if: steps.guard.outputs.skip != 'true'
        run: flutter build linux --release

      - name: Install nFPM
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          NFPM_VERSION: 2.48.0
        run: |
          set -euo pipefail
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/checksums.txt" -o /tmp/nfpm-checksums.txt
          (cd /tmp && grep " ${archive}\\$" nfpm-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$archive" -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Package versioned Linux assets
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          bundle='build/linux/x64/release/bundle'
          test -x "$bundle/vaulton"
          test -s "$bundle/lib/libdesktop_drop_plugin.so"
          mkdir -p build/release-assets
          deb="build/release-assets/vaulton-${VERSION}-linux-amd64.deb"
          rpm="build/release-assets/vaulton-${VERSION}-linux-x86_64.rpm"
          archive="build/release-assets/vaulton-${VERSION}-linux-x64.tar.gz"
          nfpm package --packager deb --config installer/nfpm.yaml --target "$deb"
          nfpm package --packager rpm --config installer/nfpm.yaml --target "$rpm"
          tar -czf "$archive" -C "$bundle" .
          cd build/release-assets
          sha256sum "vaulton-${VERSION}-linux-amd64.deb" > "vaulton-${VERSION}-linux-amd64.deb.sha256"
          sha256sum "vaulton-${VERSION}-linux-x86_64.rpm" > "vaulton-${VERSION}-linux-x86_64.rpm.sha256"
          sha256sum "vaulton-${VERSION}-linux-x64.tar.gz" > "vaulton-${VERSION}-linux-x64.tar.gz.sha256"

      - name: Attach Linux packages to GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release upload "$TAG" \
            "build/release-assets/vaulton-$VERSION-linux-amd64.deb" \
            "build/release-assets/vaulton-$VERSION-linux-amd64.deb.sha256" \
            "build/release-assets/vaulton-$VERSION-linux-x86_64.rpm" \
            "build/release-assets/vaulton-$VERSION-linux-x86_64.rpm.sha256" \
            "build/release-assets/vaulton-$VERSION-linux-x64.tar.gz" \
            "build/release-assets/vaulton-$VERSION-linux-x64.tar.gz.sha256" --clobber
