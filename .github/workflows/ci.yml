name: Validate Vaulton UI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/**'
      - 'linux/**'
      - 'windows/**'
      - 'android/**'
      - 'installer/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/**'
      - 'linux/**'
      - 'windows/**'
      - 'android/**'
      - 'installer/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      version_only: ${{ steps.changes.outputs.version_only }}
    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect a version-only release bump
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          version_only=false
          if [[ "$EVENT_NAME" == "push" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            if [[ "${#changed_files[@]}" -eq 1 && "${changed_files[0]}" == "pubspec.yaml" ]]; then
              previous_spec="$(git show "$BASE_SHA:pubspec.yaml" | sed '/^version:[[:space:]]*/d')"
              current_spec="$(sed '/^version:[[:space:]]*/d' pubspec.yaml)"
              if [[ "$previous_spec" == "$current_spec" ]]; then
                version_only=true
              fi
            fi
          fi
          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"
          echo "Version-only release bump: $version_only"

  validate:
    needs: classify
    if: needs.classify.outputs.version_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --concurrency=4 --timeout 1m
