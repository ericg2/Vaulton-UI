name: Build Android release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.3.22
        required: true
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$DISPATCH_TAG" ]]; then
            tag="$DISPATCH_TAG"
          elif [[ -n "$EVENT_TAG" ]]; then
            tag="$EVENT_TAG"
          else
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.event_name == 'release' && steps.release.outputs.tag || github.ref_name) }}

      - name: Resolve the release version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Skip if the current release already has a versioned Android APK
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          EVENT: ${{ github.event_name }}
          FORCE_REBUILD: ${{ contains(github.event.head_commit.message, '[rebuild-release-assets]') }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$FORCE_REBUILD" != "true" ]]; then
            current_version="$(awk '/^version:/ { split($2, parts, "+"); print parts[1] }' pubspec.yaml)"
            exists="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | grep -Fx "vaulton-$VERSION-android.apk" || true)"
            sha_exists="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | grep -Fx "vaulton-$VERSION-android.apk.sha256" || true)"
            if [[ "$current_version" != "$VERSION" || -z "$exists" || -z "$sha_exists" ]]; then
              skip=false
            else
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.guard.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Set up Java
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the Android signing key
        if: steps.guard.outputs.skip != 'true'
        env:
          KEYSTORE: ${{ secrets.VAULTON_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VAULTON_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VAULTON_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VAULTON_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/vaulton-release.jks"
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/vaulton-release.jks"
          } > android/key.properties

      - name: Build signed Android release
        if: steps.guard.outputs.skip != 'true'
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Attach Android package to GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          mkdir -p build/release-assets
          name="vaulton-$VERSION-android.apk"
          cp "$apk" "build/release-assets/$name"
          (cd build/release-assets && sha256sum "$name" > "$name.sha256")
          gh release upload "$TAG" "build/release-assets/$name" "build/release-assets/$name.sha256" --clobber

      - name: Remove legacy unversioned Android asset
        if: always() && steps.release.outputs.tag != '' && steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name')"
          if grep -Fxq "vaulton-$VERSION-android.apk" <<< "$assets"; then
            for asset in Vaulton-Android.apk Vaulton-Android.apk.sha256; do
              if grep -Fxq "$asset" <<< "$assets"; then gh release delete-asset "$TAG" "$asset" --yes; fi
            done
          fi
