name: Build Android release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.3.22
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=${DISPATCH_TAG:-$EVENT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Resolve the release version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the Android signing key
        env:
          KEYSTORE: ${{ secrets.VAULTON_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VAULTON_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VAULTON_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VAULTON_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/vaulton-release.jks"
          {
            printf 'storePassword=%s\\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\\n' "$KEY_ALIAS"
            printf 'storeFile=%s\\n' "$RUNNER_TEMP/vaulton-release.jks"
          } > android/key.properties

      - name: Build signed Android release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Attach Android package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          mkdir -p build/release-assets
          name="vaulton-$VERSION-android.apk"
          cp "$apk" "build/release-assets/$name"
          (cd build/release-assets && sha256sum "$name" > "$name.sha256")
          gh release upload "$TAG" "build/release-assets/$name" "build/release-assets/$name.sha256" --clobber
