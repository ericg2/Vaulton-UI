name: vaulton
description: Cross-platform client for the Vaulton API (files, backups, sync, administration).
publish_to: none
version: 1.3.11+15

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  crypto: ^3.0.6
  dio: ^5.11.1
  dynamic_color: ^1.9.0
  desktop_drop: ^0.8.4
  file_picker: ^13.1.0
  flutter_timezone: ^5.1.1
  flutter_riverpod: ^3.4.3
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  mime: ^2.1.0
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  saf: ^2.1.2
  shared_preferences: ^2.5.5
  web: ^1.1.1
  window_manager: ^0.5.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
