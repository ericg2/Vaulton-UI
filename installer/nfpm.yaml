# nFPM configuration for the Vaulton Linux packages.
#
# The release workflow builds one Debian package and one RPM package from this
# file, so both formats ship the same application bundle.
#
#   nfpm package --packager deb --config installer/nfpm.yaml --target build/release-assets
#   nfpm package --packager rpm --config installer/nfpm.yaml --target build/release-assets
name: vaulton
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: Eric E. Gold <littlelettere@gmail.com>
vendor: Vaulton
homepage: https://github.com/ericg2/Vaulton-UI
license: Proprietary
description: |
  Vaulton is a desktop client for the Vaulton API.
  Manage your files, backups and folder syncing on a server you control.
overrides:
  deb:
    depends:
      - libgtk-3-0 | libgtk-3-0t64
      - libsecret-1-0
      - libjsoncpp25 | libjsoncpp26
      - liblzma5
  rpm:
    depends:
      - gtk3
      - libsecret
      - jsoncpp
      - xz-libs
contents:
  # The application bundle keeps its own layout: the executable loads its
  # libraries and assets relative to itself.
  - src: build/linux/x64/release/bundle/vaulton
    dst: /opt/vaulton/vaulton
    file_info:
      mode: 0755
  - src: build/linux/x64/release/bundle/data/
    dst: /opt/vaulton/data
    type: tree
  - src: build/linux/x64/release/bundle/lib/
    dst: /opt/vaulton/lib
    type: tree
  - src: linux/com.ericg2.vaulton.desktop
    dst: /usr/share/applications/com.ericg2.vaulton.desktop
  - src: assets/branding/vaulton-mark.svg
    dst: /usr/share/icons/hicolor/scalable/apps/com.ericg2.vaulton.svg
  # Resolve bundled Flutter plugin libraries for every launch path.
  - src: installer/vaulton-launcher
    dst: /usr/bin/vaulton
    file_info:
      mode: 0755
