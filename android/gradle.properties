org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep the legacy AGP DSL until all transitive plugins support the new DSL.
android.newDsl=false
# AGP 9 built-in Kotlin; photo_manager and workmanager_android support this mode.
android.builtInKotlin=true

# Enable persistent foreground notifications for long-running folder sync jobs.
workmanager.enableDataSyncForegroundService=true
